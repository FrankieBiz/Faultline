name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/buggyshop-frontend/package-lock.json
            web/inspector-ui/package-lock.json
            tools/browser-runner/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: npm --prefix apps/buggyshop-frontend ci
      - run: npm --prefix tools/browser-runner ci
      - run: npm --prefix web/inspector-ui ci
      - run: make check
      - run: npx playwright install chromium
        working-directory: tools/browser-runner
      - run: make browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: tools/browser-runner/test-results/
