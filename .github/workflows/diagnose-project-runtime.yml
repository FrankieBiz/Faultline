name: Diagnose project runtime
on:
  push:
    branches: [FrankieBiz/film-ci-runtime]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.13
      - run: npm --prefix tools/browser-runner ci
      - run: npx playwright install chromium
        working-directory: tools/browser-runner
      - name: Reproduce generic Node baseline with safe diagnostics
        env:
          CI: 'true'
          FAULTLINE_REQUIRE_ISOLATED_TESTS: '1'
        run: >-
          uv run --project services/repair-orchestrator --python 3.13 --locked
          pytest services/repair-orchestrator/tests/test_project_run.py::test_real_node_repository_baseline_repair_and_proof -q
