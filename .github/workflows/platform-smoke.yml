name: Native platform smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/buggyshop-frontend/package-lock.json
            tools/browser-runner/package-lock.json
            web/inspector-ui/package-lock.json
      - name: Set up on macOS with system Bash
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/bash ./scripts/setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Set up on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\setup.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$HOME\.local\bin"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$HOME\.cargo\bin"
      - name: Exercise native launchers, caller directory, HTTP checks, and real Chromium gates
        run: uv run --project apps/buggyshop-backend --python 3.13 --locked --no-env-file pytest tests/test_platform_smoke.py -v
