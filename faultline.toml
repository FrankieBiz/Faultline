#:schema ./.faultline/schema-v1.json
# FaultLine Configuration Schema v1
schema = 1

[project]
name = "sander"
stack = "python-fastapi"
root = "."
setup_command = ""
lockfiles = []
dev_command = "uv run uvicorn app.main:app --host 127.0.0.1 --port {port}"
url = "http://127.0.0.1:{port}"
health = "/healthz"
test_command = "uv run pytest -q --junitxml={report}"

[repair]
editable = ["app/**/*.py"]
context = []
max_files = 1
max_diff_bytes = 16384
max_source_bytes = 32768
max_changed_lines = 100

[repair.imports]
allow = ["typing.cast", "fastapi.HTTPException"]
deny = []

[sandbox]
engine = "bwrap"

[sandbox.limits]
mode = "cgroup-v2-scope"
memory_max_bytes = 536870912
memory_swap_max_bytes = 0
tasks_max = 64
cpu_quota_percent = 100

[model]
provider = "meta"
model = "muse-spark-1.3"
max_attempts = 2

[budgets]
preflight = 45
baseline = 20
attempt = 75
generation = 45
verification = 20
work = 170
cleanup = 10
overall = 180

[[invariants.rule]]
id = "service_health"
name = "Service returns HTTP 200 on health check"
target = "http://127.0.0.1:{port}/healthz"
method = "GET"
expected_status = 200
