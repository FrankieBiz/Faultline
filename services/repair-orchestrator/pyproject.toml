[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "faultline-repair-orchestrator"
version = "0.1.0"
description = "Durable, bounded orchestration for repository repair"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "sse-starlette>=3,<4",
]

[project.scripts]
faultline = "app.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "httpx2>=2,<3"]

[tool.hatch.build]
dev-mode-dirs = [".", "../.."]

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared", "fixtures"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]
mypy_path = ["../.."]
